/* ---------------------------------------------------------
   ДВИЖОК СКЛОНЕНИЯ ПО ПАДЕЖАМ
--------------------------------------------------------- */
const CASE_LABELS = [
  ["nominative", "именительный"], ["genitive", "родительный"], ["partitive", "партитив"],
  ["illative", "иллатив (во что)"], ["inessive", "инессив (в чём)"], ["elative", "элатив (из чего)"],
  ["allative", "аллатив (на что/кому)"], ["adessive", "адессив (на чём/у кого)"], ["ablative", "аблатив (от чего/с чего)"],
  ["essive", "эссив (в качестве)"], ["translative", "транслатив (во что превр.)"], ["abessive", "абессив (без чего)"],
];
const IRREGULAR_CASES = {
  "veli": { illative: "veljeen", essive: "veljenä" },
  "lapsi": { illative: "lapseen", essive: "lapsena" },
};

function declineNoun(nom, gen, part) {
  if (!gen || !gen.endsWith("n") || !part) return null;
  if (IRREGULAR_CASES[nom]) {
    const genStem = gen.slice(0, -1);
    const front = /[äöy]/.test(nom);
    return {
      nominative: nom, genitive: gen, partitive: part,
      illative: IRREGULAR_CASES[nom].illative,
      inessive: genStem + (front ? "ssä" : "ssa"), elative: genStem + (front ? "stä" : "sta"),
      adessive: genStem + (front ? "llä" : "lla"), ablative: genStem + (front ? "ltä" : "lta"),
      allative: genStem + "lle", essive: IRREGULAR_CASES[nom].essive,
      translative: genStem + "ksi", abessive: genStem + (front ? "ttä" : "tta"),
    };
  }
  const genStem = gen.slice(0, -1);
  const front = /[äöy]/.test(nom);
  const lastChar = nom.slice(-1);
  const secondLast = nom.slice(-2, -1);
  const endsInVowel = /[aeiouyäö]/i.test(lastChar);
  const isDiphthongI = lastChar === "i" && /[aeoäö]/i.test(secondLast);
  const isSingleE = lastChar === "e" && secondLast !== "e";

  let illative;
  if (!endsInVowel) illative = genStem + genStem.slice(-1) + "n";
  else if (isSingleE) illative = nom + "eseen";
  else if (isDiphthongI) illative = nom + "hin";
  else illative = nom + lastChar + "n";

  const essBase = endsInVowel ? nom : genStem;
  const essive = essBase + (front ? "nä" : "na");

  return {
    nominative: nom, genitive: gen, partitive: part, illative,
    inessive: genStem + (front ? "ssä" : "ssa"), elative: genStem + (front ? "stä" : "sta"),
    adessive: genStem + (front ? "llä" : "lla"), ablative: genStem + (front ? "ltä" : "lta"),
    allative: genStem + "lle", essive,
    translative: genStem + "ksi", abessive: genStem + (front ? "ttä" : "tta"),
  };
}

function enrichWord(word, topicId) {
  const hasSpace = word.fi.includes(" ");
  let pos = word.pos;
  if (!pos) {
    if (SLANG_WORDS.has(word.fi)) pos = "разг.";
    else if (PRONOUN_WORDS.has(word.fi)) pos = "местоим.";
    else if (VERB_WORDS.has(word.fi)) pos = "гл.";
    else if (ADJ_WORDS.has(word.fi)) pos = "прил.";
    else if (hasSpace) pos = "фраза";
    else pos = "сущ.";
  }
  let example = word.example;
  if (!example) {
    const partitive = word.forms && word.forms.find((f) => f.label === "партитив");
    if (PRODUCT_TOPICS.has(topicId) && partitive) {
      example = { fi: `Onko teillä ${partitive.value}?`, ru: `У вас есть ${shortRu(word.ru)}?` };
    } else if (LOCATION_TOPICS.has(topicId) && pos === "сущ." && !hasSpace) {
      example = { fi: `Missä on ${word.fi}?`, ru: `Где находится ${shortRu(word.ru)}?` };
    }
  }
  let note = word.note;
  if (!note && hasSpace && TOPIC_CONTEXT_NOTE[topicId]) note = TOPIC_CONTEXT_NOTE[topicId];

  let cases = word.cases;
  if (!cases && !hasSpace && word.forms) {
    const gen = word.forms.find((f) => f.label === "родительный");
    const part = word.forms.find((f) => f.label === "партитив");
    if (gen && part) cases = declineNoun(word.fi, gen.value, part.value);
  }
  return { ...word, pos, example, note, cases };
}

function wordsWithIds(topic) {
  return topic.words.map((w, i) => enrichWord({ ...w, id: `${topic.id}-${i}` }, topic.id));
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function normalize(s) { return s.trim().toLowerCase(); }
function normalizeLoose(s) { return normalize(s).replace(/ä/g, "a").replace(/ö/g, "o"); }

function topicGroup(topicId) {
  if (topicId === "custom") return "custom";
  if (topicId === "mixed") return "work";
  if (TOPICS_WORK.some((t) => t.id === topicId)) return "work";
  return "general";
}

function todayStr() { return new Date().toISOString().slice(0, 10); }
function yesterdayStr() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().slice(0, 10); }

function speakFi(text) {
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "fi-FI";
    utter.rate = 0.88;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

--------------------------------------------------------- */
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}

const EMPTY_STATS = { xp: 0, streak: 0, lastPracticeDate: null, dailyXp: 0, dailyDate: null, goal: DEFAULT_GOAL };

/* ===========================================================
   ГЛАВНОЕ ПРИЛОЖЕНИЕ
=========================================================== */
function SuomenPolku() {
  const [ready, setReady] = useState(false);
  const [progress, setProgress] = useState({});
  const [customWords, setCustomWords] = useState([]);
  const [statsData, setStatsData] = useState(EMPTY_STATS);
  const [doneExercises, setDoneExercises] = useState([]);
  const [customExercises, setCustomExercises] = useState([]);
  const [mixedWords, setMixedWords] = useState([]);
  const [detailWord, setDetailWord] = useState(null);

  const [view, setView] = useState("home");
  const [activeGroup, setActiveGroup] = useState("work");
  const [activeTopicId, setActiveTopicId] = useState(null);
  const [activeExerciseId, setActiveExerciseId] = useState(null);

  const [sessionWords, setSessionWords] = useState([]);
  const [sessionMode, setSessionMode] = useState(null);
  const [sessionKey, setSessionKey] = useState(0);
  const [summaryStats, setSummaryStats] = useState(null);
  const lastSource = useRef("topic");

  const [resetArmed, setResetArmed] = useState(false);
  const firstLoad = useRef(true);
  const touchStart = useRef(null);

  useEffect(() => {
    (async () => {
      const [p, cw, st, de, ce] = await Promise.all([
        loadJSON("suomen-polku-progress", {}),
        loadJSON("suomen-polku-custom", []),
        loadJSON("suomen-polku-stats", EMPTY_STATS),
        loadJSON("suomen-polku-exercises-done", []),
        loadJSON("suomen-polku-custom-exercises", []),
      ]);
      setProgress(p); setCustomWords(cw);
      setStatsData({ ...EMPTY_STATS, ...st });
      setDoneExercises(de); setCustomExercises(ce); setReady(true);
    })();
  }, []);

  useEffect(() => { if (firstLoad.current) { firstLoad.current = false; return; } saveJSON("suomen-polku-progress", progress); }, [progress]);
  useEffect(() => { if (!ready) return; saveJSON("suomen-polku-custom", customWords); }, [customWords, ready]);
  useEffect(() => { if (!ready) return; saveJSON("suomen-polku-stats", statsData); }, [statsData, ready]);
  useEffect(() => { if (!ready) return; saveJSON("suomen-polku-exercises-done", doneExercises); }, [doneExercises, ready]);
  useEffect(() => { if (!ready) return; saveJSON("suomen-polku-custom-exercises", customExercises); }, [customExercises, ready]);

  const customTopic = useMemo(
    () => ({ id: "custom", fi: "Omat sanat", ru: "Мои слова", icon: Sparkles, words: customWords }),
    [customWords]
  );
  const mixedTopic = useMemo(
    () => ({ id: "mixed", fi: "Sekaharjoitus", ru: "Смешанная тренировка", icon: Shuffle, words: mixedWords }),
    [mixedWords]
  );
  const allExercises = useMemo(() => [...EXERCISES, ...customExercises], [customExercises]);

  function findTopic(id) {
    if (id === "custom") return customTopic;
    if (id === "mixed") return mixedTopic;
    return [...TOPICS_WORK, ...TOPICS_GENERAL].find((t) => t.id === id);
  }
  const activeTopic = activeTopicId ? findTopic(activeTopicId) : null;
  const activeExercise = activeExerciseId ? allExercises.find((e) => e.id === activeExerciseId) : null;

  function wordsOf(topic) { return (topic.id === "custom" || topic.id === "mixed") ? topic.words : wordsWithIds(topic); }

  function poolForTopic(topicId) {
    const group = topicGroup(topicId);
    if (group === "work") return ALL_WORK_WORDS;
    if (group === "general") return TOPICS_GENERAL.flatMap((t) => wordsWithIds(t));
    return customWords.length >= 4 ? customWords : [...customWords, ...ALL_WORK_WORDS];
  }

  function topicProgress(topicId) {
    const t = findTopic(topicId);
    const words = wordsOf(t);
    const known = words.filter((w) => progress[w.id]).length;
    return { known, total: words.length };
  }

  const totalKnown = useMemo(() => Object.values(progress).filter(Boolean).length, [progress]);
  const totalWords = useMemo(
    () => [...TOPICS_WORK, ...TOPICS_GENERAL].reduce((n, t) => n + t.words.length, 0) + customWords.length,
    [customWords]
  );

  function openTopic(id) { setActiveTopicId(id); setView("topic"); }

  function startMixedPractice() {
    const unknown = shuffle(ALL_WORK_WORDS.filter((w) => !progress[w.id]));
    let pool = unknown.slice(0, 12);
    if (pool.length < 8) {
      const known = shuffle(ALL_WORK_WORDS.filter((w) => progress[w.id]));
      pool = shuffle([...pool, ...known.slice(0, 12 - pool.length)]);
    }
    setMixedWords(pool);
    setActiveTopicId("mixed");
    setView("topic");
  }

  function startSession(mode, wordsOverride) {
    lastSource.current = "topic";
    setSessionWords(shuffle(wordsOverride || wordsOf(activeTopic)));
    setSessionMode(mode);
    setSessionKey((k) => k + 1);
    setView(mode);
  }

  function repeatLearning(words) {
    lastSource.current = "topic";
    setSessionWords(shuffle(words));
    setSessionMode("flashcards");
    setSessionKey((k) => k + 1);
    setView("flashcards");
  }

  function openExercise(id) {
    setActiveExerciseId(id);
    lastSource.current = "exercise";
    setSessionKey((k) => k + 1);
    setView("exercise");
  }

  function handleProgress(wordId, known) { setProgress((p) => ({ ...p, [wordId]: known })); }

  function computeXp(stats, mode) {
    if (mode === "flashcards") return stats.known * 5 + 5;
    if (mode === "quiz") return stats.correct * 10 + 5;
    if (mode === "spelling") return stats.correct * 15 + 5;
    if (mode === "exercise") return stats.correct * 10 + 10;
    return 5;
  }

  function applyXpAndStreak(earned) {
    const today = todayStr();
    const yest = yesterdayStr();
    setStatsData((prev) => {
      let streak = prev.streak, last = prev.lastPracticeDate;
      if (last === today) { /* уже засчитан сегодня */ }
      else if (last === yest) { streak = prev.streak + 1; last = today; }
      else { streak = 1; last = today; }
      const dailyXp = prev.dailyDate === today ? prev.dailyXp + earned : earned;
      return { ...prev, xp: prev.xp + earned, streak, lastPracticeDate: last, dailyXp, dailyDate: today };
    });
  }

  function setDailyGoal(g) { setStatsData((prev) => ({ ...prev, goal: g })); }

  function handleFinish(stats) {
    const mode = sessionMode;
    const earned = computeXp(stats, mode);
    applyXpAndStreak(earned);
    setSummaryStats({ ...stats, mode, earnedXp: earned });
    setView("summary");
  }

  function handleExerciseFinish(stats) {
    const earned = computeXp(stats, "exercise");
    applyXpAndStreak(earned);
    setDoneExercises((d) => (d.includes(activeExerciseId) ? d : [...d, activeExerciseId]));
    setSummaryStats({ ...stats, mode: "exercise", earnedXp: earned });
    setView("summary");
  }

  function repeatSession() {
    if (lastSource.current === "exercise") { setSessionKey((k) => k + 1); setView("exercise"); }
    else startSession(summaryStats.mode);
  }

  function addCustomWord(word) {
    const nw = { ...enrichWord(word, "custom"), id: `custom-${Date.now()}-${Math.floor(Math.random() * 1000)}` };
    setCustomWords((cw) => [...cw, nw]);
    setActiveTopicId("custom"); setView("topic");
  }
  function deleteCustomWord(id) {
    setCustomWords((cw) => cw.filter((w) => w.id !== id));
    setProgress((p) => { const np = { ...p }; delete np[id]; return np; });
  }

  function addCustomExercise(ex) {
    const nex = { ...ex, id: `custom-ex-${Date.now()}`, icon: MessagesSquare, isCustom: true };
    setCustomExercises((ces) => [...ces, nex]);
    setView("exercises");
  }
  function deleteCustomExercise(id) {
    setCustomExercises((ces) => ces.filter((e) => e.id !== id));
    setDoneExercises((d) => d.filter((x) => x !== id));
  }

  function resetProgress() {
    if (!resetArmed) { setResetArmed(true); setTimeout(() => setResetArmed(false), 3000); return; }
    setProgress({});
    try { localStorage.removeItem("suomen-polku-progress"); } catch (e) {}
    setResetArmed(false);
  }

  function goBack() {
    if (detailWord) { setDetailWord(null); return; }
    if (view === "topic" || view === "addWord" || view === "summary" || view === "progress" || view === "exercises") setView("home");
    else if (view === "flashcards" || view === "quiz" || view === "spelling") setView("topic");
    else if (view === "exercise" || view === "createExercise") setView("exercises");
  }
  function onTouchStart(e) { const t = e.touches[0]; touchStart.current = { x: t.clientX, y: t.clientY }; }
  function onTouchEnd(e) {
    if (!touchStart.current) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - touchStart.current.x;
    const dy = t.clientY - touchStart.current.y;
    if (touchStart.current.x < 50 && dx > 70 && Math.abs(dy) < 60 && (view !== "home" || detailWord)) goBack();
    touchStart.current = null;
  }

  const fontImport =
    "@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');";

  return (
    <div
      onTouchStart={onTouchStart}
      onTouchEnd={onTouchEnd}
      style={{ background: C.paper, minHeight: "100vh", fontFamily: "'Manrope', sans-serif", color: C.ink, fontSize: 16, position: "relative" }}
    >
      <style>{`
        ${fontImport}
        * { box-sizing: border-box; }
        .disp { font-family: 'Fraunces', serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        button, input, textarea, select { font-family: inherit; }
        input:focus, textarea:focus { outline: none; border-color: ${C.spruce} !important; }
        .flip-inner { transition: transform 0.45s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
        .flip-inner.flipped { transform: rotateY(180deg); }
        .flip-face { backface-visibility: hidden; }
        .flip-back { transform: rotateY(180deg); }
        @media (prefers-reduced-motion: reduce) { .flip-inner { transition: none; } }
        .press:active { transform: scale(0.97); }
      `}</style>

      <div style={{ maxWidth: 460, margin: "0 auto", minHeight: "100vh" }} className="px-4 pb-10">
        {view === "home" && (
          <HomeScreen
            ready={ready} totalKnown={totalKnown} totalWords={totalWords} stats={statsData}
            activeGroup={activeGroup} setActiveGroup={setActiveGroup}
            topicProgress={topicProgress} openTopic={openTopic}
            customCount={customWords.length}
            onAddWord={() => setView("addWord")}
            onOpenProgress={() => setView("progress")}
            onOpenExercises={() => setView("exercises")}
            onMixedPractice={startMixedPractice}
            onSetGoal={setDailyGoal}
            doneExercisesCount={doneExercises.length} totalExercises={allExercises.length}
            resetArmed={resetArmed} resetProgress={resetProgress}
          />
        )}
        {view === "progress" && (
          <ProgressScreen topicProgress={topicProgress} totalKnown={totalKnown} totalWords={totalWords}
            customCount={customWords.length} stats={statsData} onBack={() => setView("home")} />
        )}
        {view === "addWord" && <AddWordScreen onSave={addCustomWord} onCancel={() => setView("home")} />}
        {view === "topic" && activeTopic && (
          <TopicScreen
            topic={activeTopic} group={topicGroup(activeTopic.id)} stats={topicProgress(activeTopic.id)}
            onBack={() => setView("home")} onStart={(mode) => startSession(mode)}
            onAddWord={() => setView("addWord")} onDeleteWord={deleteCustomWord}
            onOpenDetail={setDetailWord}
          />
        )}
        {view === "flashcards" && (
          <FlashcardSession key={sessionKey} words={sessionWords} topic={activeTopic} group={topicGroup(activeTopic.id)}
            onProgress={handleProgress} onFinish={handleFinish} onExit={() => setView("topic")} onOpenDetail={setDetailWord} />
        )}
        {view === "quiz" && (
          <QuizSession key={sessionKey} words={sessionWords} topic={activeTopic} group={topicGroup(activeTopic.id)}
            pool={poolForTopic(activeTopic.id)} onProgress={handleProgress} onFinish={handleFinish} onExit={() => setView("topic")} />
        )}
        {view === "spelling" && (
          <SpellingSession key={sessionKey} words={sessionWords} topic={activeTopic} group={topicGroup(activeTopic.id)}
            onProgress={handleProgress} onFinish={handleFinish} onExit={() => setView("topic")} />
        )}
        {view === "exercises" && (
          <ExercisesListScreen exercises={allExercises} doneExercises={doneExercises}
            onBack={() => setView("home")} onOpen={openExercise}
            onCreate={() => setView("createExercise")} onDelete={deleteCustomExercise} />
        )}
        {view === "createExercise" && (
          <CreateExerciseScreen onSave={addCustomExercise} onCancel={() => setView("exercises")} />
        )}
        {view === "exercise" && activeExercise && (
          <ExerciseSession key={sessionKey} exercise={activeExercise} onFinish={handleExerciseFinish} onExit={() => setView("exercises")} />
        )}
        {view === "summary" && summaryStats && (
          <SummaryScreen
            topic={summaryStats.mode === "exercise" ? { ru: activeExercise?.title } : activeTopic}
            group={summaryStats.mode === "exercise" ? "work" : topicGroup(activeTopic.id)}
            stats={summaryStats} liveStats={statsData}
            onHome={() => setView("home")} onRepeat={repeatSession}
            onRepeatLearning={repeatLearning} />
        )}
      </div>

      {detailWord && <WordDetailModal word={detailWord} onClose={() => setDetailWord(null)} />}
    </div>
  );
}

function CreateExerciseScreen({ onSave, onCancel }) {
  const [title, setTitle] = useState("");
  const [situation, setSituation] = useState("");
  const [lines, setLines] = useState([]);
  const [speaker, setSpeaker] = useState("Ты");
  const [template, setTemplate] = useState("");
  const [correct, setCorrect] = useState("");
  const [wrongText, setWrongText] = useState("");
  const [ru, setRu] = useState("");
  const [error, setError] = useState("");

  const inputStyle = {
    width: "100%", padding: "12px 14px", borderRadius: 12,
    border: `1.5px solid ${C.line}`, background: C.paper, fontSize: 15, color: C.ink,
  };
  const labelStyle = { fontSize: 12.5, color: C.mist, marginBottom: 6, display: "block", fontWeight: 600 };

  function addLine() {
    setError("");
    if (!template.includes("___")) { setError("В реплике должен быть пропуск: ___"); return; }
    if (!correct.trim() || !ru.trim()) { setError("Заполните правильный ответ и перевод"); return; }
    const wrongs = wrongText.split(",").map((s) => s.trim()).filter(Boolean).slice(0, 3);
    if (wrongs.length < 1) { setError("Добавьте хотя бы один явно неверный вариант через запятую"); return; }
    const side = RIGHT_SPEAKERS.has(speaker.trim().toLowerCase()) ? "right" : "left";
    const options = shuffle([correct.trim(), ...wrongs]);
    setLines((ls) => [...ls, { speaker: speaker.trim() || "Собеседник", side, template: template.trim(), correct: correct.trim(), options, ru: ru.trim() }]);
    setTemplate(""); setCorrect(""); setWrongText(""); setRu("");
  }

  function removeLine(i) { setLines((ls) => ls.filter((_, idx) => idx !== i)); }

  function submit() {
    if (!title.trim() || !situation.trim()) { setError("Заполните название и описание ситуации"); return; }
    if (lines.length < 2) { setError("Добавьте минимум 2 реплики"); return; }
    onSave({ title: title.trim(), situation: situation.trim(), lines });
  }

  return (
    <div className="pt-8">
      <BackButton onClick={onCancel} label="Задания" />
      <div className="disp" style={{ fontSize: 26, fontWeight: 700, color: C.spruceDeep, marginTop: 16, marginBottom: 6 }}>
        Своё задание
      </div>
      <div style={{ fontSize: 13, color: C.mist, marginBottom: 20 }}>
        Опишите ситуацию, затем добавьте реплики с пропуском <span className="mono">___</span>. Совет: делайте неверные варианты явно неподходящими по смыслу — так задание не будет двусмысленным.
      </div>

      <div className="flex flex-col gap-4 mb-6">
        <div>
          <label style={labelStyle}>Название задания *</label>
          <input style={inputStyle} value={title} onChange={(e) => setTitle(e.target.value)} placeholder="напр. Вопрос про доставку" />
        </div>
        <div>
          <label style={labelStyle}>Ситуация *</label>
          <input style={inputStyle} value={situation} onChange={(e) => setSituation(e.target.value)} placeholder="напр. Покупатель спрашивает про самовывоз" />
        </div>
      </div>

      {lines.length > 0 && (
        <div className="flex flex-col gap-2 mb-6">
          {lines.map((l, i) => (
            <div key={i} className="flex items-center gap-2 rounded-xl" style={{ background: C.paperDeep, border: `1px solid ${C.line}`, padding: "10px 12px" }}>
              <div style={{ flex: 1 }}>
                <div className="mono" style={{ fontSize: 10, color: C.mist }}>{l.speaker}</div>
                <div style={{ fontSize: 13.5 }}>{l.template.replace("___", l.correct)}</div>
                <div style={{ fontSize: 12, color: C.mist }}>{l.ru}</div>
              </div>

        <div className="flex flex-col gap-3">

          </div>

            <input style={inputStyle} value={template} onChange={(e) => setTemplate(e.target.value)} placeholder="напр. ___ nouto mahdollinen?" autoCapitalize="off" autoCorrect="off" />

            <input style={inputStyle} value={correct} onChange={(e) => setCorrect(e.target.value)} placeholder="напр. Onko" autoCapitalize="off" autoCorrect="off" />
          </div>
          <div>
            <label style={labelStyle}>Явно неверные варианты (через запятую, 1–3 штуки)</label>
            <input style={inputStyle} value={wrongText} onChange={(e) => setWrongText(e.target.value)} placeholder="напр. Kiitos, Näkemiin, Anteeksi" autoCapitalize="off" autoCorrect="off" />
          </div>
          <div>
            <label style={labelStyle}>Перевод всей реплики на русский</label>
            <input style={inputStyle} value={ru} onChange={(e) => setRu(e.target.value)} placeholder="напр. Возможен самовывоз?" />
          </div>
        </div>
        <button onClick={addLine} className="press w-full mt-4" style={{
          padding: "12px 0", borderRadius: 13, background: C.lake, color: C.paper, fontWeight: 700, fontSize: 14,
          display: "flex", alignItems: "center", justifyContent: "center", gap: 7,
        }}>
          <Plus size={16} /> Добавить реплику
        </button>
      </div>

      {error && <div style={{ color: C.berry, fontSize: 13, marginBottom: 12 }}>{error}</div>}

      <button onClick={submit} className="press w-full" style={{
        padding: "17px 0", borderRadius: 17, background: C.amber, color: C.paper, fontWeight: 700, fontSize: 16,
      }}>
        Сохранить задание ({lines.length} {lines.length === 1 ? "реплика" : "реплики"})
      </button>
    </div>
  );
}

/* ===========================================================
   ЗАДАНИЕ — диалог с пропусками
   В истории всегда показывается верный вариант (чтобы не терять смысл
   диалога), а иконка рядом с именем говорящего отмечает, была ли попытка
   правильной с первого раза.
=========================================================== */
function ExerciseSession({ exercise, onFinish, onExit }) {
  const [idx, setIdx] = useState(0);
  const [resolved, setResolved] = useState([]);
  const [selected, setSelected] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(0);
  const [options, setOptions] = useState(() => shuffle(exercise.lines[0].options));

  const line = exercise.lines[idx];
  const isLast = idx === exercise.lines.length - 1;

  function pick(opt) {
    if (selected) return;
    const isRight = opt === line.correct;
    setSelected(opt);
    if (isRight) { setCorrect((n) => n + 1); setStreak((s) => { const ns = s + 1; setBest((b) => Math.max(b, ns)); return ns; }); }
    else setStreak(0);
  }

  function next() {
    const finishedLine = { ...line, wasCorrect: selected === line.correct };
    const nextResolved = [...resolved, finishedLine];
    setResolved(nextResolved);
    setSelected(null);
    if (idx + 1 < exercise.lines.length) {
      const ni = idx + 1;
      setIdx(ni);
      setOptions(shuffle(exercise.lines[ni].options));
    } else {
      onFinish({ correct, total: exercise.lines.length, best });
    }
  }

  function renderTemplate(text, fillValue) {
    const parts = text.split("___");
    return (
      <span>
        {parts[0]}
        <span className="mono" style={{ fontWeight: 700, color: C.lakeDeep }}>{fillValue}</span>
        {parts[1]}
      </span>
    );
  }

  return (
    <div className="pt-8">
      <div className="flex items-center justify-between">
        <BackButton onClick={onExit} label="Задания" />
        <div className="flex items-center gap-3">
          {streak > 1 && <span className="mono flex items-center gap-1" style={{ fontSize: 13, color: C.amber }}><Flame size={15} /> {streak}</span>}
          <span className="mono" style={{ fontSize: 13, color: C.mist }}>{idx + 1}/{exercise.lines.length}</span>
        </div>
      </div>
      <div style={{ height: 5, borderRadius: 3, background: C.line, marginTop: 16, overflow: "hidden" }}>
        <div style={{ width: `${(idx / exercise.lines.length) * 100}%`, height: "100%", background: C.lake, transition: "width .3s" }} />
      </div>

      <div className="disp" style={{ fontSize: 20, fontWeight: 700, color: C.spruceDeep, marginTop: 18 }}>{exercise.title}</div>
      <div style={{ fontSize: 13, color: C.mist, marginBottom: 18 }}>{exercise.situation}</div>

      <div className="flex flex-col gap-3">
        {resolved.map((l, i) => (
          <div key={i} className={`flex ${l.side === "right" ? "justify-end" : "justify-start"}`}>
            <div style={{
              maxWidth: "85%", padding: "10px 14px", borderRadius: 16,
              background: l.side === "right" ? C.lake : C.paperDeep,
              color: l.side === "right" ? C.paper : C.ink,
              borderBottomRightRadius: l.side === "right" ? 4 : 16,
              borderBottomLeftRadius: l.side === "right" ? 16 : 4,
            }}>
              <div className="flex items-center gap-1.5" style={{ marginBottom: 3 }}>
                <span className="mono" style={{ fontSize: 10, opacity: 0.75 }}>{l.speaker}</span>
                {l.wasCorrect
                  ? <Check size={11} color={l.side === "right" ? "#CFE0D8" : C.spruce} />
                  : <X size={11} color={l.side === "right" ? "#F3D2D5" : C.berry} />}
              </div>
              <div style={{ fontSize: 14.5 }}>{renderTemplate(l.template, l.correct)}</div>
              <div style={{ fontSize: 12, opacity: 0.8, marginTop: 3 }}>{l.ru}</div>
            </div>
          </div>
        ))}

        <div className={`flex ${line.side === "right" ? "justify-end" : "justify-start"}`}>
          <div style={{
            maxWidth: "85%", padding: "10px 14px", borderRadius: 16,
            background: line.side === "right" ? "rgba(37,105,166,0.12)" : C.paperDeep,
            border: `1.5px dashed ${line.side === "right" ? C.lake : C.mist}`,
            color: C.ink,
          }}>
            <div className="mono" style={{ fontSize: 10, color: C.mist, marginBottom: 3 }}>{line.speaker}</div>
            <div style={{ fontSize: 14.5 }}>
              {line.template.split("___")[0]}
              <span className="mono" style={{ fontWeight: 700, color: C.mist }}>___</span>
              {line.template.split("___")[1]}
            </div>
            <div style={{ fontSize: 12, color: C.mist, marginTop: 3 }}>{line.ru}</div>
          </div>
        </div>
      </div>

      <div className="flex flex-col gap-2.5 mt-6">
        {options.map((opt) => {
          const isCorrectOpt = opt === line.correct;
          const isSelected = selected === opt;
          let bg = C.paperDeep, border = C.line, color = C.ink;
          if (selected) {
            if (isCorrectOpt) { bg = C.spruce; border = C.spruceDeep; color = C.paper; }
            else if (isSelected) { bg = C.berry; border = C.berry; color = C.paper; }
          }
          return (
            <button key={opt} onClick={() => pick(opt)} className="press" disabled={!!selected} style={{
              padding: "14px 16px", borderRadius: 14, background: bg, border: `1.5px solid ${border}`, color,
              fontSize: 15, fontWeight: 600, textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              <span className="mono">{opt}</span>
              {selected && isCorrectOpt && <Check size={18} />}
              {selected && isSelected && !isCorrectOpt && <X size={18} />}
            </button>
          );
        })}
      </div>

      {selected && (
        <button onClick={next} className="press w-full" style={{
          marginTop: 18, padding: "16px 0", borderRadius: 16, background: C.spruceDeep,
          color: C.paper, fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 8,
        }}>{isLast ? "Завершить" : "Далее"} <ChevronRight size={17} /></button>
      )}
    </div>
  );
}

        </div>
        <div className="flex items-center gap-2 rounded-2xl px-4 py-3" style={{ flex: 1, background: C.lakeTint, border: `1px solid ${C.lake}55` }}>

/* ===========================================================
   ДОБАВЛЕНИЕ СВОЕГО СЛОВА
=========================================================== */
function AddWordScreen({ onSave, onCancel }) {
  const [fi, setFi] = useState("");
  const [ru, setRu] = useState("");
  const [note, setNote] = useState("");
  const [extra, setExtra] = useState("");
  const [error, setError] = useState("");

  function submit() {
    if (!fi.trim() || !ru.trim()) { setError("Заполните финское слово и перевод"); return; }
    onSave({ fi: fi.trim(), ru: ru.trim(), note: note.trim() || undefined, extra: extra.trim() || undefined });
  }

  const inputStyle = {
    width: "100%", padding: "14px 16px", borderRadius: 13,
    border: `1.5px solid ${C.line}`, background: C.paper, fontSize: 16, color: C.ink,
  };
  const labelStyle = { fontSize: 13, color: C.mist, marginBottom: 7, display: "block", fontWeight: 600 };

  return (
    <div className="pt-8">
      <BackButton onClick={onCancel} label="Отмена" />
      <div className="disp" style={{ fontSize: 28, fontWeight: 700, color: C.spruceDeep, marginTop: 18, marginBottom: 22 }}>
        Новое слово
      </div>
      <div className="flex flex-col gap-5">
        <div>
          <label style={labelStyle}>Финское слово или фраза *</label>
          <input style={inputStyle} value={fi} onChange={(e) => setFi(e.target.value)}
            placeholder="напр. valikoima" autoCapitalize="off" autoCorrect="off" />
        </div>
        <div>
          <label style={labelStyle}>Перевод на русский *</label>
          <input style={inputStyle} value={ru} onChange={(e) => setRu(e.target.value)} placeholder="напр. ассортимент" />
        </div>
        <div>
          <label style={labelStyle}>Заметка (необязательно)</label>
          <input style={inputStyle} value={note} onChange={(e) => setNote(e.target.value)}
            placeholder="контекст, где услышали слово" />
        </div>
        <div>
          <label style={labelStyle}>Доп. информация (необязательно)</label>
          <textarea style={{ ...inputStyle, minHeight: 90, resize: "vertical" }} value={extra}
            onChange={(e) => setExtra(e.target.value)}
            placeholder="множественное число, прошедшее время, синонимы и т.д." />
        </div>
        {error && <div style={{ color: C.berry, fontSize: 14 }}>{error}</div>}
      </div>

      <button onClick={submit} className="press w-full mt-9" style={{
        padding: "17px 0", borderRadius: 17, background: C.amber, color: C.paper, fontWeight: 700, fontSize: 16,
      }}>
        Сохранить слово
      </button>
    </div>
  );
}

/* ===========================================================
   ЭКРАН ТЕМЫ
=========================================================== */
function TopicScreen({ topic, group, stats, onBack, onStart, onAddWord, onDeleteWord, onOpenDetail }) {
  const Icon = topic.icon;
  const words = (topic.id === "custom" || topic.id === "mixed") ? topic.words : wordsWithIds(topic);
  const isCustom = topic.id === "custom";
  const col = groupColor(group);
  const [armedDelete, setArmedDelete] = useState(null);
  const [filterText, setFilterText] = useState("");

  function handleDeleteClick(id) {
    if (armedDelete === id) { onDeleteWord(id); setArmedDelete(null); }
    else { setArmedDelete(id); setTimeout(() => setArmedDelete((a) => (a === id ? null : a)), 2500); }
  }

  const filtered = filterText.trim()
    ? words.filter((w) => normalize(w.fi).includes(normalize(filterText)) || normalize(w.ru).includes(normalize(filterText)))
    : words;

  return (
    <div className="pt-8">
      <BackButton onClick={onBack} label={topic.id === "mixed" ? "Главная" : "Все темы"} />
      <div className="flex items-center gap-3 mt-6 mb-1">
        <div style={{ width: 48, height: 48, borderRadius: "50%", background: col.main,
          display: "flex", alignItems: "center", justifyContent: "center" }}>
          <Icon size={22} color={C.paper} />
        </div>
        <div>
          <div className="disp" style={{ fontSize: 24, fontWeight: 700, color: C.spruceDeep }}>{topic.fi}</div>
          <div style={{ fontSize: 14, color: C.mist }}>{topic.ru} · {stats.known}/{stats.total} изучено</div>
        </div>
      </div>

      {words.length === 0 ? (
        <div className="mt-8 rounded-2xl text-center" style={{ background: C.paperDeep, border: `1px solid ${C.line}`, padding: 26 }}>
          <div style={{ fontSize: 15, color: C.mist, marginBottom: 16 }}>Здесь пока пусто. Добавьте первое слово, которое узнали на смене.</div>
          <button onClick={onAddWord} className="press" style={{
            padding: "12px 20px", borderRadius: 15, background: C.amber, color: C.paper, fontWeight: 700, fontSize: 14,
            display: "inline-flex", alignItems: "center", gap: 7,
          }}>
            <Plus size={16} /> Добавить слово
          </button>
        </div>
      ) : (
        <>
          <div className="flex flex-col gap-3 mt-8">
            <button onClick={() => onStart("flashcards")} className="press" style={{ ...cardBtnStyle(col), borderLeft: `4px solid ${col.main}` }}>
              <div className="flex items-center gap-3">
                <Layers size={22} color={col.main} />
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>Карточки</div>
                  <div style={{ fontSize: 13, color: C.mist }}>Свайп вправо — знаю, влево — не знаю</div>
                </div>
              </div>
              <ChevronRight size={20} color={col.main} />
            </button>

            <button onClick={() => onStart("quiz")} className="press" style={{ ...cardBtnStyle(col), borderLeft: `4px solid ${col.main}` }}>
              <div className="flex items-center gap-3">
                <Brain size={22} color={col.main} />
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>Тест</div>
                  <div style={{ fontSize: 13, color: C.mist }}>Выбор перевода из четырёх вариантов</div>
                </div>
              </div>
              <ChevronRight size={20} color={col.main} />
            </button>

            <button onClick={() => onStart("spelling")} className="press" style={{ ...cardBtnStyle(col), borderLeft: `4px solid ${col.main}` }}>
              <div className="flex items-center gap-3">
                <PenLine size={22} color={col.main} />
                <div>
                  <div style={{ fontWeight: 700, fontSize: 16 }}>Правописание</div>
                  <div style={{ fontSize: 13, color: C.mist }}>Напишите слово по-фински на слух перевода</div>
                </div>
              </div>
              <ChevronRight size={20} color={col.main} />
            </button>
          </div>

          <div className="mt-10">
            <div className="flex items-center justify-between mb-3">
              <div className="mono" style={{ fontSize: 13, color: C.mist, textTransform: "uppercase", letterSpacing: 0.5 }}>
                Слова в теме · нажмите для подробностей
              </div>
              {isCustom && (
                <button onClick={onAddWord} className="press flex items-center gap-1" style={{ background: "none", border: "none", color: C.amber, fontSize: 13, fontWeight: 700 }}>
                  <Plus size={14} /> добавить
                </button>
              )}
            </div>

            {words.length > 6 && (
              <div className="flex items-center gap-2 mb-3" style={{
                background: C.paperDeep, border: `1px solid ${C.line}`, borderRadius: 12, padding: "9px 12px",
              }}>
                <Search size={15} color={C.mist} />
                <input
                  value={filterText} onChange={(e) => setFilterText(e.target.value)}
                  placeholder="Найти слово..." autoCapitalize="off" autoCorrect="off"
                  style={{ border: "none", background: "transparent", outline: "none", fontSize: 14, flex: 1, color: C.ink }}
                />
              </div>
            )}

            <div className="flex flex-col gap-1">
              {filtered.map((w) => {
                const hasDetail = (w.forms && w.forms.length) || w.note || w.extra || w.example || w.cases;
                return (
                  <div key={w.id} className="flex items-center" style={{ padding: "13px 2px", borderBottom: `1px solid ${C.line}` }}>
                    <button
                      onClick={() => hasDetail && onOpenDetail(w)}
                      className="press flex-1 flex items-center justify-between"
                      style={{ background: "none", border: "none", textAlign: "left" }}
                    >
                      <div className="flex items-center gap-2">
                        <span className="disp" style={{ fontWeight: 600, fontSize: 16, color: C.spruceDeep }}>{w.fi}</span>
                        <span className="mono" style={{ fontSize: 10, color: col.main, border: `1px solid ${col.main}55`, borderRadius: 6, padding: "1px 6px" }}>{w.pos}</span>
                        {hasDetail && <BookMarked size={13} color={C.mist} />}
                      </div>
                      <span style={{ fontSize: 14, color: C.mist }}>{w.ru}</span>
                    </button>
                    <button onClick={(e) => { e.stopPropagation(); speakFi(w.fi); }} className="press" style={{ background: "none", border: "none", color: C.lake, padding: "4px 4px 4px 10px" }}>
                      <Volume2 size={16} />
                    </button>
                    {isCustom && (
                      <button
                        onClick={(e) => { e.stopPropagation(); handleDeleteClick(w.id); }} className="press"
                        style={{ background: "none", border: "none", color: armedDelete === w.id ? C.berry : C.mist, padding: 5 }}
                      >
                        <Trash2 size={15} />
                      </button>
                    )}
                  </div>
                );
              })}
              {filtered.length === 0 && (
                <div style={{ fontSize: 13, color: C.mist, padding: "12px 2px" }}>Ничего не найдено.</div>
              )}
            </div>
          </div>
        </>
      )}
    </div>
  );
}

function cardBtnStyle(col) {
  return {
    background: col ? col.tint : C.paperDeep, border: `1px solid ${C.line}`, borderRadius: 17, padding: "17px 18px",
    display: "flex", alignItems: "center", justifyContent: "space-between", textAlign: "left",
  };
}

/* ===========================================================
   КАРТОЧКИ — со свайпом, боковой озвучкой и «словарной» обраткой
=========================================================== */
function FlashcardSession({ words, topic, group, onProgress, onFinish, onExit, onOpenDetail }) {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(0);
  const [learning, setLearning] = useState(0);
  const [learningList, setLearningList] = useState([]);
  const [dragX, setDragX] = useState(0);
  const [dragging, setDragging] = useState(false);
  const startRef = useRef(null);
  const col = groupColor(group);

  if (!words.length) return null;
  const w = words[idx];
  const threshold = 90;

  function answer(knowsIt) {
    onProgress(w.id, knowsIt);
    const nk = known + (knowsIt ? 1 : 0);
    const nl = learning + (knowsIt ? 0 : 1);
    const nList = knowsIt ? learningList : [...learningList, w];
    setKnown(nk); setLearning(nl); setLearningList(nList);
    setFlipped(false); setDragX(0); setDragging(false); startRef.current = null;
    if (idx + 1 < words.length) setIdx((n) => n + 1);
    else onFinish({ known: nk, learning: nl, total: words.length, learningList: nList });
  }

  function onTouchStart(e) {
    e.stopPropagation();
    const t = e.touches[0];
    startRef.current = { x: t.clientX, y: t.clientY };
    setDragging(true);
  }
  function onTouchMove(e) {
    if (!startRef.current) return;
    e.stopPropagation();
    const t = e.touches[0];
    const dx = t.clientX - startRef.current.x;
    const dy = t.clientY - startRef.current.y;
    if (Math.abs(dx) > Math.abs(dy)) setDragX(dx);
  }
  function onTouchEndCard(e) {
    if (!startRef.current) return;
    e.stopPropagation();
    const t = e.changedTouches[0];
    const dx = t.clientX - startRef.current.x;
    const dy = t.clientY - startRef.current.y;
    const horizontal = Math.abs(dx) > Math.abs(dy);
    if (horizontal && Math.abs(dx) > threshold) { e.preventDefault(); answer(dx > 0); return; }
    if (Math.abs(dx) < 10 && Math.abs(dy) < 10) { e.preventDefault(); setFlipped((f) => !f); }
    setDragX(0); setDragging(false); startRef.current = null;
  }

  const knowOpacity = Math.min(Math.max(dragX, 0) / threshold, 1);
  const noOpacity = Math.min(Math.max(-dragX, 0) / threshold, 1);
  const hasFullDetail = (w.forms && w.forms.length) || w.example || w.note || w.extra || w.cases;

  return (
    <div className="pt-8">
      <div className="flex items-center justify-between">
        <BackButton onClick={onExit} label={topic.ru} />
        <span className="mono" style={{ fontSize: 13, color: C.mist }}>{idx + 1}/{words.length}</span>
      </div>
      <div style={{ height: 5, borderRadius: 3, background: C.line, marginTop: 16, overflow: "hidden" }}>
        <div style={{ width: `${(idx / words.length) * 100}%`, height: "100%", background: col.main, transition: "width .3s" }} />
      </div>

      <div style={{ marginTop: 30, position: "relative", paddingRight: 22 }}>
        <div style={{ perspective: 1200, position: "relative" }}>
          <div style={{
            position: "absolute", top: 16, left: 16, zIndex: 3, padding: "6px 12px", borderRadius: 10,
            background: C.berry, color: C.paper, fontWeight: 700, fontSize: 13, opacity: noOpacity,
            transform: "rotate(-8deg)", pointerEvents: "none",
          }}>НЕ ЗНАЮ</div>
          <div style={{
            position: "absolute", top: 16, right: 16, zIndex: 3, padding: "6px 12px", borderRadius: 10,
            background: col.main, color: C.paper, fontWeight: 700, fontSize: 13, opacity: knowOpacity,
            transform: "rotate(8deg)", pointerEvents: "none",
          }}>ЗНАЮ</div>

          <div
            onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEndCard}
            onClick={() => setFlipped((f) => !f)}
            className={`flip-inner ${flipped ? "flipped" : ""} press`}
            style={{
              position: "relative", minHeight: hasFullDetail ? 340 : 260,
              transform: `${flipped ? "rotateY(180deg) " : ""}translateX(${dragX}px) rotate(${dragX / 22}deg)`,
              transition: dragging ? "none" : undefined,
            }}
          >
            <div className="flip-face" style={{
              position: "absolute", inset: 0, borderRadius: 24, background: C.paper, border: `1px solid ${C.line}`,
              display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 22, cursor: "pointer",
            }}>
              <span className="mono" style={{ fontSize: 12, color: C.mist, textTransform: "uppercase", letterSpacing: 1, marginBottom: 16 }}>Suomeksi</span>
              <div className="disp" style={{ fontSize: 33, fontWeight: 700, color: C.spruceDeep, textAlign: "center" }}>{w.fi}</div>
              <span className="mono" style={{ fontSize: 11, color: C.mist, marginTop: 10, border: `1px solid ${C.line}`, borderRadius: 8, padding: "2px 8px" }}>{w.pos}</span>
              <span style={{ fontSize: 13, color: C.mist, marginTop: 18, textAlign: "center" }}>нажмите — перевернуть · свайп — ответ</span>
            </div>
            <div className="flip-face flip-back" style={{
              position: "absolute", inset: 0, borderRadius: 24, background: col.main, border: `1px solid ${col.deep}`,
              display: "flex", flexDirection: "column", alignItems: "center", padding: "24px 22px", cursor: "pointer", overflow: "auto",
            }}>
              <span className="mono" style={{ fontSize: 12, color: "#EAF1EC", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>По-русски</span>
              <div className="disp" style={{ fontSize: 25, fontWeight: 700, color: C.paper, textAlign: "center" }}>{w.ru}</div>
              <span className="mono" style={{ fontSize: 11, color: C.paper, marginTop: 8, border: "1px solid rgba(255,255,255,0.4)", borderRadius: 8, padding: "2px 8px" }}>{w.pos}</span>

              {w.forms && w.forms.length > 0 && (
                <div style={{ marginTop: 16, width: "100%", maxWidth: 250, borderTop: "1px solid rgba(255,255,255,0.25)", paddingTop: 12 }}>
                  {w.forms.map((f, i) => (
                    <div key={i} className="flex justify-between" style={{ fontSize: 13, padding: "4px 0", color: "#EAF1EC" }}>
                      <span>{f.label}</span>
                      <span className="mono" style={{ fontWeight: 700, color: C.paper }}>{f.value}</span>
                    </div>
                  ))}
                </div>
              )}

              {w.example && (
                <div className="rounded-xl mt-3 w-full" style={{ maxWidth: 250, background: "rgba(255,255,255,0.14)", padding: "10px 12px" }}>
                  <div className="flex items-center gap-1.5 mb-1" style={{ color: "#EAF1EC" }}>
                    <Quote size={12} />
                    <span style={{ fontSize: 10.5, fontWeight: 700, textTransform: "uppercase", letterSpacing: 0.4 }}>Пример</span>
                  </div>
                  <div style={{ fontSize: 13, fontStyle: "italic", color: C.paper }}>{w.example.fi}</div>
                  <div style={{ fontSize: 12, color: "#EAF1EC", marginTop: 2 }}>{w.example.ru}</div>
                </div>
              )}

              {w.note && (
                <div className="flex items-start gap-1.5 mt-3" style={{ maxWidth: 250, color: "#EAF1EC" }}>
                  <Info size={12} style={{ marginTop: 2, flexShrink: 0 }} />
                  <span style={{ fontSize: 12.5, textAlign: "left" }}>{w.note}</span>
                </div>
              )}
              {w.extra && <div style={{ fontSize: 12, color: "#EAF1EC", marginTop: 10, textAlign: "center", maxWidth: 250, whiteSpace: "pre-wrap" }}>{w.extra}</div>}

              {w.cases && (
                <button
                  onClick={(e) => { e.stopPropagation(); onOpenDetail(w); }}
                  className="press flex items-center gap-1.5 mt-4"
                  style={{ background: "rgba(255,255,255,0.18)", border: "1px solid rgba(255,255,255,0.4)", borderRadius: 12, padding: "8px 14px", color: C.paper, fontSize: 12.5, fontWeight: 700 }}
                >
                  <BookMarked size={13} /> Все падежи слова
                </button>
              )}
            </div>
          </div>
        </div>

        <button
          onClick={(e) => { e.stopPropagation(); speakFi(w.fi); }}
          className="press"
          style={{
            position: "absolute", top: "50%", right: 0, transform: "translateY(-50%)", zIndex: 4,
            width: 44, height: 44, borderRadius: "50%", background: C.paper, border: `2px solid ${col.main}`,
            boxShadow: "0 2px 8px rgba(24,32,24,0.18)",
            display: "flex", alignItems: "center", justifyContent: "center",
          }}
        >
          <Volume2 size={19} color={col.main} />
        </button>
      </div>

      <div className="flex gap-3 mt-9">
        <button onClick={() => answer(false)} className="press" style={{
          flex: 1, padding: "17px 0", borderRadius: 17, background: "transparent", border: `1.5px solid ${C.berry}`,
          color: C.berry, fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
        }}><X size={19} /> Не знаю</button>
        <button onClick={() => answer(true)} className="press" style={{
          flex: 1, padding: "17px 0", borderRadius: 17, background: col.main, border: `1.5px solid ${col.deep}`,
          color: C.paper, fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
        }}><Check size={19} /> Знаю</button>
      </div>
    </div>
  );
}

/* ===========================================================
   ТЕСТ (выбор варианта)
=========================================================== */
function QuizSession({ words, topic, group, pool, onProgress, onFinish, onExit }) {
  const [idx, setIdx] = useState(0);
  const [options, setOptions] = useState([]);
  const [selected, setSelected] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(0);
  const col = groupColor(group);

  useEffect(() => { buildQuestion(0); /* eslint-disable-next-line */ }, []);

  function buildQuestion(i) {
    const q = words[i];
    const others = pool.filter((w) => w.id !== q.id);
    const distractors = shuffle(others).slice(0, 3);
    setOptions(shuffle([q, ...distractors]));
    setSelected(null);
  }

  if (!words.length || !words[idx]) return null;
  const question = words[idx];

  function pick(opt) {
    if (selected) return;
    const isRight = opt.id === question.id;
    setSelected(opt.id);
    onProgress(question.id, isRight);
    if (isRight) { setCorrect((n) => n + 1); setStreak((s) => { const ns = s + 1; setBest((b) => Math.max(b, ns)); return ns; }); }
    else setStreak(0);
  }

  function next() {
    if (idx + 1 < words.length) { const ni = idx + 1; setIdx(ni); buildQuestion(ni); }
    else onFinish({ correct, total: words.length, best });
  }

  return (
    <div className="pt-8">
      <div className="flex items-center justify-between">
        <BackButton onClick={onExit} label={topic.ru} />
        <div className="flex items-center gap-3">
          {streak > 1 && <span className="mono flex items-center gap-1" style={{ fontSize: 13, color: C.amber }}><Flame size={15} /> {streak}</span>}
          <span className="mono" style={{ fontSize: 13, color: C.mist }}>{idx + 1}/{words.length}</span>
        </div>
      </div>
      <div style={{ height: 5, borderRadius: 3, background: C.line, marginTop: 16, overflow: "hidden" }}>
        <div style={{ width: `${(idx / words.length) * 100}%`, height: "100%", background: col.main, transition: "width .3s" }} />
      </div>

      <div className="mt-10 mb-4 text-center">
        <span className="mono" style={{ fontSize: 12, color: C.mist, textTransform: "uppercase", letterSpacing: 1 }}>Как переводится</span>
        <div className="flex items-center justify-center gap-2" style={{ marginTop: 9 }}>
          <div className="disp" style={{ fontSize: 30, fontWeight: 700, color: C.spruceDeep }}>{question.fi}</div>
          <button onClick={() => speakFi(question.fi)} className="press" style={{ background: "none", border: "none", color: col.main, padding: 4 }}>
            <Volume2 size={20} />
          </button>
        </div>
      </div>

      <div className="flex flex-col gap-3 mt-4">
        {options.map((opt) => {
          const isCorrect = opt.id === question.id;
          const isSelected = selected === opt.id;
          let bg = C.paperDeep, border = C.line, color = C.ink;
          if (selected) {
            if (isCorrect) { bg = col.main; border = col.deep; color = C.paper; }
            else if (isSelected) { bg = C.berry; border = C.berry; color = C.paper; }
          }
          return (
            <button key={opt.id} onClick={() => pick(opt)} className="press" disabled={!!selected} style={{
              padding: "17px 18px", borderRadius: 15, background: bg, border: `1.5px solid ${border}`, color,
              fontSize: 16, fontWeight: 600, textAlign: "left", display: "flex", justifyContent: "space-between", alignItems: "center",
            }}>
              {opt.ru}
              {selected && isCorrect && <Check size={19} />}
              {selected && isSelected && !isCorrect && <X size={19} />}
            </button>
          );
        })}
      </div>

      {selected && (
        <button onClick={next} className="press" style={{
          marginTop: 24, width: "100%", padding: "17px 0", borderRadius: 17, background: C.spruceDeep,
          color: C.paper, fontWeight: 700, fontSize: 15, display: "flex", alignItems: "center", justifyContent: "center", gap: 9,
        }}>{idx + 1 < words.length ? "Далее" : "Завершить"} <ChevronRight size={17} /></button>
      )}
    </div>
  );
}

/* ===========================================================
   ПРАВОПИСАНИЕ
=========================================================== */
function SpellingSession({ words, topic, group, onProgress, onFinish, onExit }) {
  const [idx, setIdx] = useState(0);
  const [value, setValue] = useState("");
  const [result, setResult] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [streak, setStreak] = useState(0);
  const [best, setBest] = useState(0);
  const inputRef = useRef(null);
  const col = groupColor(group);

  useEffect(() => { inputRef.current && inputRef.current.focus(); }, [idx]);

  if (!words.length) return null;
  const w = words[idx];

  function submit() {
    if (result || !value.trim()) return;
    const exact = normalize(value) === normalize(w.fi);
    const loose = normalizeLoose(value) === normalizeLoose(w.fi);
    const status = exact ? "correct" : loose ? "almost" : "wrong";
    setResult(status);
    const isRight = status === "correct";
    onProgress(w.id, isRight);
    if (isRight) { setCorrect((n) => n + 1); setStreak((s) => { const ns = s + 1; setBest((b) => Math.max(b, ns)); return ns; }); }
    else setStreak(0);
  }

  function next() {
    setValue(""); setResult(null);
    if (idx + 1 < words.length) setIdx((n) => n + 1);
    else onFinish({ correct, total: words.length, best });
  }

  const boxColor = result === "correct" ? col.main : result === "wrong" ? C.berry : result === "almost" ? C.amber : C.line;

  return (
    <div className="pt-8">
      <div className="flex items-center justify-between">
        <BackButton onClick={onExit} label={topic.ru} />
        <div className="flex items-center gap-3">
          {streak > 1 && <span className="mono flex items-center gap-1" style={{ fontSize: 13, color: C.amber }}><Flame size={15} /> {streak}</span>}
          <span className="mono" style={{ fontSize: 13, color: C.mist }}>{idx + 1}/{words.length}</span>
        </div>
      </div>
      <div style={{ height: 5, borderRadius: 3, background: C.line, marginTop: 16, overflow: "hidden" }}>
        <div style={{ width: `${(idx / words.length) * 100}%`, height: "100%", background: col.main, transition: "width .3s" }} />
      </div>

      <div className="mt-10 mb-7 text-center">
        <span className="mono" style={{ fontSize: 12, color: C.mist, textTransform: "uppercase", letterSpacing: 1 }}>Напишите по-фински</span>
        <div className="disp" style={{ fontSize: 30, fontWeight: 700, color: C.spruceDeep, marginTop: 9 }}>{w.ru}</div>
      </div>

      <input
        ref={inputRef} value={value} onChange={(e) => setValue(e.target.value)}
        onKeyDown={(e) => { if (e.key === "Enter") (result ? next() : submit()); }}
        disabled={!!result} autoCapitalize="off" autoCorrect="off" spellCheck="false"
        placeholder="напишите слово..."
        style={{
          width: "100%", padding: "18px 20px", borderRadius: 17, fontSize: 19, textAlign: "center",
          border: `2px solid ${boxColor}`, background: C.paper, color: C.ink,
        }}
      />

      {result && (
        <div className="text-center mt-5">
          <div style={{ color: result === "correct" ? col.main : result === "almost" ? C.amber : C.berry, fontSize: 14, fontWeight: 700 }}>
            {result === "correct" && "Верно!"}
            {result === "almost" && "Почти! Обратите внимание на ä / ö"}
            {result === "wrong" && "Не совсем"}
          </div>
          <div className="flex items-center justify-center gap-2 mt-2">
            <div className="mono" style={{ color: C.ink, fontWeight: 700, fontSize: 17 }}>{w.fi}</div>
            <button onClick={() => speakFi(w.fi)} className="press" style={{ background: "none", border: "none", color: col.main, padding: 4 }}>
              <Volume2 size={17} />
            </button>
          </div>
        </div>
      )}

      <button onClick={result ? next : submit} className="press w-full mt-7" style={{
        padding: "17px 0", borderRadius: 17,
        background: result ? C.spruceDeep : col.main, color: C.paper, fontWeight: 700, fontSize: 15,
      }}>
        {result ? (idx + 1 < words.length ? "Далее" : "Завершить") : "Проверить"}
      </button>
    </div>
  );
}

/* ===========================================================
   ИТОГИ
=========================================================== */
function SummaryScreen({ topic, group, stats, liveStats, onHome, onRepeat, onRepeatLearning }) {
  const col = groupColor(group);
  const hasLearning = stats.mode === "flashcards" && stats.learningList && stats.learningList.length > 0;
  return (
    <div className="pt-14 flex flex-col items-center text-center">
      <div style={{ width: 78, height: 78, borderRadius: "50%", background: C.amber,
        display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 16 }}>
        <Trees size={32} color={C.paper} />
      </div>
      <div className="disp" style={{ fontSize: 28, fontWeight: 700, color: C.spruceDeep }}>Привал пройден</div>
      <div style={{ fontSize: 15, color: C.mist, marginTop: 5 }}>{topic?.ru}</div>

      <div className="flex items-center gap-2 rounded-2xl px-5 py-2.5 mt-5" style={{ background: C.lake, border: `1px solid ${C.lakeDeep}` }}>
        <Zap size={17} color={C.paper} />
        <span style={{ color: C.paper, fontWeight: 800, fontSize: 16 }}>+{stats.earnedXp} XP</span>
      </div>
      <div className="flex items-center gap-1.5 mt-2" style={{ color: C.mist, fontSize: 13 }}>
        <Flame size={14} color={C.amber} /> Серия: {liveStats.streak} {liveStats.streak === 1 ? "день" : "дней"} подряд
      </div>

      <div className="w-full mt-7 rounded-2xl" style={{ background: C.paperDeep, border: `1px solid ${C.line}`, padding: 22 }}>
        {stats.mode === "flashcards" ? (
          <div className="flex justify-around">
            <Stat label="Знаю" value={stats.known} color={col.main} />
            <Stat label="Учу дальше" value={stats.learning} color={C.berry} />
          </div>
        ) : (
          <div className="flex justify-around">
            <Stat label="Верно" value={`${stats.correct}/${stats.total}`} color={col.main} />
            <Stat label="Лучшая серия" value={stats.best} icon={<Flame size={15} color={C.amber} />} />
          </div>
        )}
      </div>

      <div className="flex flex-col gap-3 w-full mt-9">
        {hasLearning && (
          <button onClick={() => onRepeatLearning(stats.learningList)} className="press" style={{
            padding: "17px 0", borderRadius: 17, background: "transparent", border: `1.5px solid ${C.berry}`,
            color: C.berry, fontWeight: 700, fontSize: 15,
          }}>
            Повторить незнакомые ({stats.learningList.length})
          </button>
        )}
        <button onClick={onRepeat} className="press" style={{ padding: "17px 0", borderRadius: 17, background: col.main, color: C.paper, fontWeight: 700, fontSize: 15 }}>
          {hasLearning ? "Повторить всю тему" : "Повторить ещё раз"}
        </button>
        <button onClick={onHome} className="press" style={{ padding: "17px 0", borderRadius: 17, background: "transparent", border: `1.5px solid ${C.line}`, color: C.ink, fontWeight: 600, fontSize: 15 }}>
          На тропу
        </button>
      </div>
    </div>
  );
}

function Stat({ label, value, color, icon }) {
  return (
    <div>
      <div className="mono flex items-center justify-center gap-1" style={{ fontSize: 24, fontWeight: 700, color: color || C.spruceDeep }}>{icon}{value}</div>
      <div style={{ fontSize: 12, color: C.mist, marginTop: 3 }}>{label}</div>
    </div>
  );
}

function BackButton({ onClick, label }) {
  return (
    <button onClick={onClick} className="press flex items-center gap-1" style={{ background: "none", border: "none", color: C.mist, fontSize: 14, padding: 6 }}>
      <ArrowLeft size={16} /> {label}
    </button>
  );
}

createRoot(document.getElementById("root")).render(<SuomenPolku />);
